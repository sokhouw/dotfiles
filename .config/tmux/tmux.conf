# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# terminal
set-option -a terminal-features 'xterm-256color:RGB'


# enable mouse
setw -g mouse on

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Use Alt-N to select pane
bind-key -n M-0 select-pane -t 10
bind-key -n M-1 select-pane -t 1
bind-key -n M-2 select-pane -t 2
bind-key -n M-3 select-pane -t 3
bind-key -n M-4 select-pane -t 4
bind-key -n M-5 select-pane -t 5
bind-key -n M-6 select-pane -t 6
bind-key -n M-7 select-pane -t 7
bind-key -n M-8 select-pane -t 8
bind-key -n M-9 select-pane -t 9
#
# Use <Prefix> N to select window
bind-key 0 select-window -t 10
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9
#
# Use Alt-S and Alt-D to sync and desync panes
bind-key -n M-s setw synchronize-panes on
bind-key -n M-d setw synchronize-panes off

# open panes and windows in current dir of the current pane
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind R source ~/.config/tmux/tmux.conf

# ------------------------------------------------------------------------------
# Tmux Plugin Manager
# ------------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"

set-hook -g after-new-session '
  run-shell "
    if [ ! -d \"$TMUX_PLUGIN_MANAGER_PATH\" ]; then
      mkdir -p \"$TMUX_PLUGIN_MANAGER_PATH\";
    fi;
    if [ ! -d \"$TMUX_PLUGIN_MANAGER_PATH/tpm\" ]; then
      git clone https://github.com/tmux-plugins/tpm \"$TMUX_PLUGIN_MANAGER_PATH/tpm\";
    fi;
    if [ ! -d \"$TMUX_PLUGIN_MANAGER_PATH/tmux-powerkit\" ]; then
      git clone https://github.com/fabioluciano/tmux-powerkit \"$TMUX_PLUGIN_MANAGER_PATH/tmux-powerkit\";
    fi;
    $TMUX_PLUGIN_MANAGER_PATH/tpm/tpm;
  "
'
# <leader>I (Ctr-A I) to install new plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'fabioluciano/tmux-powerkit'

# set -g @plugin 'sainnhe/tmux-fzf':w

# ------------------------------------------------------------------------------
# tmux-powerkit
# ------------------------------------------------------------------------------

# theme selector <LEADER>C-r
set -g @plugin_theme 'tokyo-night'
set -g @powerkit_theme_variant 'storm'
set -g @powerkit_plugins 'git,cpu,datetime'

# ------------------------------------------------------------------------------
# tmux-fzf
# ------------------------------------------------------------------------------

# unbind f
# bind-key -n C-f run-shell -b "#{TMUX_PLUGIN_MANAGER_PATH}/tmux-fzf/main.sh"
#
# TMUX_FZF_OPTIONS="-p -w 80% -h 80% -m"

run "#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm"     
